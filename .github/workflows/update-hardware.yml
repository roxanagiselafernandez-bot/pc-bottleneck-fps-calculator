name: Actualizar hardware.json semanalmente

on:
  schedule:
    # Todos los lunes 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar validación y refresco de hardware.json
        run: node scripts/update-hardware.mjs

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet -- hardware.json; then
            echo "Sin cambios en hardware.json"
            exit 0
          fi
          git config user.name "hardware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hardware.json
          git commit -m "chore: validación semanal de hardware.json"
          git push
